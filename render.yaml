services:
  - type: web
    name: voxel-realms
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MAX_PLAYERS
        value: 30
      - key: WORLD_SEED
        value: 48151623
